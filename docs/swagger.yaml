basePath: /api/v1
definitions:
  dto.ErrorResponse:
    properties:
      error:
        type: string
      statusCode:
        type: integer
      statusDesc:
        type: string
    type: object
  dto.ProductResponse:
    properties:
      categoryDesc:
        type: string
      categoryName:
        type: string
      id:
        type: integer
      name:
        type: string
      price:
        type: number
      stock:
        type: integer
    type: object
  dto.SuccessResponse:
    properties:
      data: {}
      statusCode:
        type: integer
      statusDesc:
        type: string
    type: object
info:
  contact: {}
  description: This is API documentation for kasir-api
  title: Kasir API
  version: "1.0"
paths:
  /products:
    get:
      consumes:
      - application/json
      description: get list products
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ProductResponse'
                  type: array
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: List products
      tags:
      - products
  /products/{id}:
    get:
      consumes:
      - application/json
      description: get detail product
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProductResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Detail product
      tags:
      - products
swagger: "2.0"
